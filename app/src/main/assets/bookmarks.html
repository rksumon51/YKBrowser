<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bookmarks</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#1f1f1f; color:#e3e3e3; font-family:Roboto, Arial, sans-serif; min-height:100vh; }
  .header { padding:16px; display:flex; align-items:center; gap:12px; border-bottom:1px solid #3c4043; position:sticky; top:0; background:#1f1f1f; }
  .header h1 { font-size:20px; font-weight:500; }
  .back { width:40px; height:40px; border-radius:50%; border:none; background:transparent; color:#e3e3e3; font-size:20px; cursor:pointer; }
  .list { padding:8px 0; }
  .item { display:flex; align-items:center; gap:12px; padding:12px 16px; cursor:pointer; }
  .item:active { background:#3c4043; }
  .fav { width:32px; height:32px; border-radius:50%; background:#303134; display:flex; align-items:center; justify-content:center; overflow:hidden; flex-shrink:0; }
  .fav img { width:20px; height:20px; }
  .info { flex:1; min-width:0; }
  .title { font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .url { font-size:13px; color:#9aa0a6; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .empty { text-align:center; color:#5f6368; padding:40px 20px; }
</style>
</head>
<body>
<div class="header">
  <button class="back" onclick="history.back()">←</button>
  <h1>Bookmarks</h1>
</div>
<div class="list" id="list"></div>
<script>
(function(){
  try {
    // Bookmarks are managed via the app; showing placeholder
    // TODO: Add getBookmarks() to HomeJs bridge
    var list = document.getElementById('list');
    list.innerHTML = '<div class="empty">Bookmarks will appear here<br><br>Long-press a link to bookmark it</div>';
  } catch(e){ document.getElementById('list').innerHTML = '<div class="empty">Error</div>'; }
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
})();
</script>
</body>
</html>
