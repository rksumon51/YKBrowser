<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Tab</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root {
    --bg:#1f1f1f; --surface:#303134; --surface-hover:#3c4043;
    --text:#e8eaed; --text-secondary:#9aa0a6; --hint:#5f6368;
    --shadow:0 1px 6px rgba(0,0,0,.45);
  }
  :root[data-theme="light"] {
    --bg:#f8f9fa; --surface:#f1f3f4; --surface-hover:#e8eaed;
    --text:#202124; --text-secondary:#5f6368; --hint:#80868b;
    --shadow:0 1px 6px rgba(60,64,67,.18);
  }
  body {
    background:var(--bg); color:var(--text);
    font-family:Roboto, Arial, sans-serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
  }
  .topbar {
    width:100%; display:flex; justify-content:space-between; align-items:center;
    padding:10px 14px;
  }
  .topbar .left, .topbar .right { display:flex; align-items:center; gap:6px; }
  .icon-btn {
    width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:transparent; border:none; color:var(--text); cursor:pointer;
  }
  .icon-btn:active { background:var(--surface-hover); }
  .yk-logo {
    width:76px; height:76px; border-radius:18px; margin:20px 0 22px;
    box-shadow:var(--shadow); user-select:none;
  }
  .searchbar {
    width:92%; max-width:580px; height:54px; background:var(--surface); border-radius:27px;
    display:flex; align-items:center; padding:0 6px 0 16px; gap:8px;
    box-shadow:var(--shadow);
  }
  .searchbar input {
    flex:1; background:transparent; border:none; outline:none; color:var(--text); font-size:16px; min-width:0;
  }
  .searchbar input::placeholder { color:var(--text-secondary); }
  .sicon { width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:none; background:transparent; cursor:pointer; flex-shrink:0;}
  .sicon:active { background:var(--surface-hover); }
  .pills { display:flex; gap:12px; margin:20px 0 4px; }
  .pill {
    background:var(--surface); border:none; color:var(--text); border-radius:24px;
    padding:11px 22px; font-size:15px; display:flex; align-items:center; gap:8px; cursor:pointer;
  }
  .pill:active { background:var(--surface-hover); }
  .shortcuts {
    width:94%; max-width:580px; margin-top:24px;
    display:grid; grid-template-columns:repeat(4, 1fr); gap:8px 4px;
    padding:8px 2px 24px;
  }
  .sc {
    display:flex; flex-direction:column; align-items:center; gap:8px;
    min-width:0; text-decoration:none; color:var(--text); cursor:pointer;
    background:none; border:none; font-family:inherit; padding:4px 2px;
  }
  .sc .fav {
    width:58px; height:58px; border-radius:50%; background:var(--surface);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .sc .fav img { width:34px; height:34px; }
  .sc .fav .letter { font-size:26px; font-weight:500; color:var(--text-secondary); }
  .sc .lbl { font-size:12px; max-width:78px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--text);}
  .sc:active .fav { background:var(--surface-hover); }
  .empty-hint { color:var(--hint); font-size:13px; margin-top:6px; text-align:center; padding:0 30px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="left">
    <button class="icon-btn" onclick="goHome()" aria-label="Home">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    </button>
  </div>
</div>

<img class="yk-logo" src="yk_logo.png" alt="YK Browser">

<div class="searchbar">
  <svg width="24" height="24" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.5 12.3c0-.9-.1-1.5-.3-2.2H12v4.3h6.5c-.1 1.1-.8 2.7-2.4 3.8l3.7 2.9c2.3-2.1 3.7-5.1 3.7-8.8z"/><path fill="#34A853" d="M12 24c3.2 0 5.9-1.1 7.9-2.9l-3.8-2.9c-1 .7-2.4 1.2-4.1 1.2-3.1 0-5.8-2.1-6.8-5l-3.9 3C3.4 21.3 7.4 24 12 24z"/><path fill="#FBBC05" d="M5.2 14.4c-.2-.7-.4-1.5-.4-2.4s.1-1.7.4-2.4l-3.9-3C.5 8.3 0 10.1 0 12s.5 3.7 1.3 5.3l3.9-2.9z"/><path fill="#EA4335" d="M12 4.7c1.8 0 3 .8 3.7 1.4l3.3-3.2C17.9 1.1 15.2 0 12 0 7.4 0 3.4 2.7 1.3 6.7l3.9 3c1-2.9 3.7-5 6.8-5z"/></svg>
  <input id="q" type="text" placeholder="Search Google or type URL" autocomplete="off"
         onkeydown="if(event.key==='Enter')doSearch()">
  <button class="sicon" aria-label="Voice search">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="#9aa0a6"><path d="M12 15c1.66 0 3-1.34 3-3V6c0-1.66-1.34-3-3-3S9 4.34 9 6v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/></svg>
  </button>
  <button class="sicon" aria-label="Google Lens">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="#9aa0a6"><path d="M9.5 6.5v3h-3v9h9v-3h3v3c0 1.1-.9 2-2 2h-9c-1.1 0-2-.9-2-2v-9c0-1.1.9-2 2-2h3zm6.5 0V4.5C16 3.4 15.1 2.5 14 2.5h-1v3h1v1h-1v3h3v-1h1v-1h-1V6.5h-2.5zM18.5 2.5h-1v3h1v1h-1v3h2.5v-1h1v-1h-1V6.5h-2.5v1z" opacity=".9"/><circle cx="12" cy="12" r="3.2" fill="none" stroke="#9aa0a6" stroke-width="1.6"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3" stroke="#9aa0a6" stroke-width="1.6"/></svg>
  </button>
</div>

<div class="pills">
  <button class="pill" onclick="location.href='https://www.google.com'">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.9 5.8 5.8 1.9-5.8 1.9L12 17.4l-1.9-5.8L4.3 9.7l5.8-1.9L12 2zm7 9l.9 2.7 2.7.9-2.7.9-.9 2.7-.9-2.7-2.7-.9 2.7-.9.9-2.7z"/></svg>
    AI Mode
  </button>
</div>

<div class="shortcuts" id="shortcuts"></div>
<div class="empty-hint" id="emptyHint" style="display:none">Your most visited sites will appear here</div>

<script>
(function applyTheme(){
  var params = new URLSearchParams(location.search);
  var theme = params.get('theme') === 'light' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', theme);
  window.__ykTheme = theme;
})();
function doSearch(){
  var q = document.getElementById('q').value.trim();
  if(!q) return;
  if(/^https?:\/\//i.test(q) || (/^[\w-]+(\.[\w-]+)+/.test(q) && !/\s/.test(q))){
    if(!/^https?:\/\//i.test(q)) q = 'https://' + q;
    location.href = q;
  } else {
    location.href = 'https://www.google.com/search?q=' + encodeURIComponent(q);
  }
}
function goHome(){ location.href = 'file:///android_asset/home.html?theme=' + (window.__ykTheme || 'dark'); }

(function loadShortcuts(){
  try {
    if(!window.AndroidHome) return;
    var data = JSON.parse(window.AndroidHome.getShortcuts() || '[]');
    var box = document.getElementById('shortcuts');
    if(!data.length){ document.getElementById('emptyHint').style.display='block'; return; }
    data.forEach(function(s){
      var b = document.createElement('button');
      b.className = 'sc';
      b.onclick = function(){ location.href = s.url; };
      var fav = document.createElement('div');
      fav.className = 'fav';
      var img = document.createElement('img');
      img.alt = '';
      img.src = 'https://www.google.com/s2/favicons?domain=' + encodeURIComponent(s.host) + '&sz=64';
      img.onerror = function(){
        fav.innerHTML = '';
        var l = document.createElement('div');
        l.className = 'letter';
        l.textContent = (s.host||'?').charAt(0).toUpperCase();
        fav.appendChild(l);
      };
      fav.appendChild(img);
      var lbl = document.createElement('div');
      lbl.className = 'lbl';
      lbl.textContent = s.label || s.host;
      b.appendChild(fav); b.appendChild(lbl);
      box.appendChild(b);
    });
  } catch(e){}
})();
</script>
</body>
</html>
